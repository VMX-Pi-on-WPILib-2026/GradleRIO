// A C++ robot program for a Studica VMX-pi (WPILib 2026 with the VMX-pi HAL).
// Build: ./gradlew build   Deploy: ./gradlew deploy   (once per PC: ./gradlew installArm64Toolchain)

plugins {
    id "cpp"
    id "edu.wpi.first.GradleRIO" version "2026.2.2-vmx.1"
}

deploy {
    targets {
        vmx(getTargetTypeClass('VmxPi')) {
            // Login of the VMX image; override with VMX_USER / VMX_PASSWORD.
            username = System.getenv('VMX_USER') ?: 'ubuntu'
            password = System.getenv('VMX_PASSWORD') ?: 'password'
            // Adds the wired address (172.22.11.2) and the robot Wi-Fi address (10.TE.AM.2).
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                frcCpp(getArtifactTypeClass('WPILibNativeArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = deploy.targets.vmx.homeDirectory + '/deploy'
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.vmx.artifacts.frcCpp

// Simulation configuration
wpi.cpp.debugSimulation = false
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

model {
    components {
        frcUserProgram(NativeExecutableSpec) {
            targetPlatform wpi.platforms.linuxarm64
            targetPlatform wpi.platforms.desktop

            sources.cpp {
                source {
                    srcDir 'src/main/cpp'
                }
                exportedHeaders {
                    srcDir 'src/main/include'
                }
            }

            deployArtifact.component = it
            wpi.cpp.enableExternalTasks(it)

            wpi.sim.enable(it)
            // Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
            wpi.cpp.vendor.cpp(it)
            wpi.cpp.deps.wpilib(it)
        }
    }
}
